info:
  name: Get for Project
  type: http
  seq: 3
http:
  method: POST
  url: '{{url}}/api/v3/context-url/get'
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{"project_id": 123}'
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |
        test("status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("response has urls", function() {
          const body = res.getBody();
          expect(body).to.have.property('urls');
        });
