name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Build
      run: npm run build

    # The tag is the single source of truth for the released version.
    # npm publish reads package.json, so without this the manifest version
    # decides what npm receives and a tag whose version was never committed
    # fails with "cannot publish over the previously published versions".
    # Not committed back: the working copy is discarded after the run, so
    # package.json on main can lag behind the published version.
    - name: Set version from tag
      run: |
        V="${GITHUB_REF_NAME#v}"
        npm version "$V" --no-git-tag-version --allow-same-version
        echo "Publishing $(node -p "require('./package.json').name")@$V"

    - name: Publish to npm (OIDC trusted publisher)
      run: npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ''

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          dist/**
