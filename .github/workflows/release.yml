name: Release

on:
  push:
    tags:
      - 'v*.*.*'

  # Listing on the MCP registry is the one part of a release that can fail after
  # npm has already published, and it cannot be recovered by re-running the
  # failed job: `registry` needs `release`, both check out the tag, and npm
  # rejects a second publish of a version it already serves, so `release` would
  # fail before `registry` was reached. Moving the tag has the same outcome.
  # 2.3.0's listing had to be published by hand for exactly that reason. This
  # input runs the listing on its own against an existing tag.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to list on the MCP registry, without the leading v (for example 2.3.0). The tag must exist and npm must already serve that version.'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  # Publishing to npm happens only on a tag. A manual run exists to repair a lost
  # registry listing, and npm has nothing to repair — it either has the version or
  # the job below will refuse to list it.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Build
      run: npm run build

    # The tag is the single source of truth for the released version.
    # npm publish reads package.json, so without this the manifest version
    # decides what npm receives and a tag whose version was never committed
    # fails with "cannot publish over the previously published versions".
    # Not committed back: the working copy is discarded after the run, so
    # package.json on main can lag behind the published version.
    - name: Set version from tag
      run: |
        V="${GITHUB_REF_NAME#v}"
        npm version "$V" --no-git-tag-version --allow-same-version
        echo "Publishing $(node -p "require('./package.json').name")@$V"

    - name: Publish to npm (OIDC trusted publisher)
      run: npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ''

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          dist/**

  # Listing on the MCP registry is a separate job, not more steps on the one
  # above, so that a failure here can be re-run on its own. Folded into the
  # release job, `gh run rerun --failed` would replay `npm publish` for a
  # version npm already has, which is a hard error and would leave the registry
  # permanently one version behind.
  #
  # Nothing here is built or tested: mcp-publisher reads server.json and talks
  # to two HTTP APIs.
  registry:
    runs-on: ubuntu-latest
    needs: release
    # A skipped dependency skips whatever needs it, so a manual run reaches this
    # job only with always(). The result check is what always() then costs us: it
    # has to be spelled out, or a failed npm publish would be followed by a
    # listing attempt for a version npm does not serve.
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.release.result == 'success')
    permissions:
      contents: read
      id-token: write

    steps:
    # Before the checkout, because it chooses what to check out. The input is
    # read through the environment rather than interpolated into the script: a
    # `${{ }}` inside a run block is pasted in as text before the shell sees it,
    # so a crafted input would run as code.
    - name: Resolve the version to list
      id: target
      env:
        REQUESTED: ${{ inputs.version }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
          V="${REQUESTED#v}"
        else
          V="${GITHUB_REF_NAME#v}"
        fi
        case "$V" in
          ''|*[!0-9.]*)
            echo "::error::'$V' is not a bare version like 2.3.0"
            exit 1
            ;;
        esac
        echo "version=$V" >> "$GITHUB_OUTPUT"
        echo "Listing $V"

    # The tag, not the branch: the listing describes a released version, and on a
    # manual run the default ref would be whatever main happens to say now.
    - uses: actions/checkout@v6
      with:
        ref: refs/tags/v${{ steps.target.outputs.version }}

    # Same reason as the release job: the tag is the version, and the committed
    # server.json is documentation that a test keeps aligned with package.json.
    - name: Set version from tag
      env:
        V: ${{ steps.target.outputs.version }}
      run: |
        jq --arg v "$V" '.version = $v | .packages[0].version = $v' server.json > server.tagged.json
        mv server.tagged.json server.json

    # The registry proves we own the npm package by fetching the published
    # manifest and comparing its `mcpName` against the server name, so it can
    # only succeed once the new version is actually readable from npm. That is
    # not guaranteed the instant `npm publish` returns in the job before this
    # one. Poll rather than sleep, and fail loudly rather than silently skip.
    - name: Wait for the published version to be readable from npm
      env:
        V: ${{ steps.target.outputs.version }}
      run: |
        EXPECTED="$(jq -r '.name' server.json)"
        for i in $(seq 1 30); do
          ACTUAL="$(npm view "@ostico/bruno-mcp@$V" mcpName 2>/dev/null || true)"
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "npm serves $V with mcpName $ACTUAL"
            exit 0
          fi
          echo "attempt $i/30: got '${ACTUAL:-<nothing>}', want '$EXPECTED'"
          sleep 10
        done
        echo "::error::@ostico/bruno-mcp@$V never became readable from npm with mcpName '$EXPECTED'"
        exit 1

    - name: Install mcp-publisher
      run: |
        OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
        ARCH="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
        curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" \
          | tar xz mcp-publisher

    # No secret: the registry accepts the same GitHub OIDC token npm does, and
    # grants publish rights over `io.github.<repository_owner>/*` from it.
    - name: Publish to the MCP registry
      run: |
        ./mcp-publisher login github-oidc
        ./mcp-publisher publish
