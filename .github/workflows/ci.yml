name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    # Advisory only: the repo has no ESLint config yet, so this cannot gate.
    - name: Run linting
      run: npm run lint
      continue-on-error: true

    # Blocking: a failing test suite must fail the build.
    - name: Run tests
      run: npm test

    # ── Coverage artifact (consumed by the test-guard job) ────────────
    # Generated once, on the 24.x leg only, to avoid a duplicate upload.
    - name: Generate coverage report
      if: matrix.node-version == '24.x'
      run: npx jest --coverage --coverageReporters=clover --coverageReporters=text-summary
      continue-on-error: true

    - name: Upload coverage artifact
      if: matrix.node-version == '24.x'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage/clover.xml
        retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js 22.x
      uses: actions/setup-node@v6
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build for production
      run: npm run build

    - name: Test MCP server startup
      run: timeout 5s node dist/index.js || true

  # ────────────────────────────────────────────────────────────────────
  # test-guard (PR only)
  #
  # Downloads the "coverage-report" artifact produced by the test job and
  # runs ostico/test-guard to evaluate test adequacy on changed files.
  # Skippable with the 'test-guard-exception' PR label. Skipped on forks
  # (no access to the GitHub Models token used for the AI review).
  # ────────────────────────────────────────────────────────────────────
  test-guard:
    name: Test adequacy gate
    runs-on: ubuntu-latest
    needs: test
    # Run only for same-repo PRs (head repo == this repo). NOTE: this repo is
    # itself a fork, so head.repo.fork is always true here — a `.fork` check
    # would skip every PR. Compare full_name instead to still exclude PRs
    # opened from external forks (no token access for the AI review).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.event.repository.full_name &&
      !contains(github.event.pull_request.labels.*.name, 'test-guard-exception')
    concurrency:
      group: bruno-mcp-test-guard-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      checks: write
      models: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report

      - name: Test Guard
        uses: ostico/test-guard@v1
        with:
          coverage-file: clover.xml
          coverage-threshold: '95'
          # src/bruno/types.ts is interfaces and type aliases (plus three tiny
          # Error subclasses). A diff there is normally non-executable lines, so
          # there is no diff-coverage data to judge and the gate reports the file
          # as missing from the coverage report. Excluded for the same reason as
          # **/*.d.ts. Keep that file declarations-only; real logic belongs in a
          # module the gate can measure.
          extra-exclude-patterns: '.github/**, dist/**, tests/**, coverage/**, **/*.d.ts, src/index.ts, src/bruno/types.ts'
          ai-enabled: 'true'
          ai-model: 'openai/gpt-4.1-mini'
          test-patterns: |
            {
              "ts-unit": {"src_pattern": "src/**/*.ts", "test_template": "tests/**/{name}.test.ts"}
            }
