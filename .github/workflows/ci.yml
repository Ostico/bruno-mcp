name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # Naming `types` REPLACES the default set rather than extending it, so the
    # three defaults are relisted here on purpose. Dropping one silently would
    # cost every push its CI run.
    #
    # `edited` is the addition. It is the event a pull request emits when its
    # base branch changes, which includes the retarget GitHub performs
    # automatically when a stacked PR's base is merged. Without it such a PR
    # lands on `main` carrying no checks at all, and it does not recover on its
    # own: the workflow association never formed, so later pushes produced no
    # run either and the PR had to be reopened by hand to get one.
    #
    # `edited` also fires on title and body edits, and those run the full suite
    # too. Skipping them with a job-level `if` was tried and reverted: a skipped
    # job still posts a check run under the job's name, and "Test adequacy gate"
    # is a required context, so the skipped result superseded the passing one
    # and the ruleset refused the merge. Paying for a redundant run is the
    # cheaper half of that trade — an unmergeable green PR is the expensive one.
    types: [ opened, synchronize, reopened, edited ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # NOTE: there is deliberately no `npm run build` step here.
    # The integration jest project's globalSetup (tests/global-setup.ts) builds
    # unconditionally, so every step below that needs dist/ gets a freshly built
    # one, and an explicit step here only added a third build to this leg.
    # Verified with dist/ deleted: typecheck, lint and the full unit lane all
    # pass with dist/ still absent, and the integration lane emits both entries
    # (dist/index.js and dist/bruno/sandbox-worker.js) on its own.
    # Production build health is still gated twice — by that globalSetup build,
    # which surfaces build output on failure, and by the dedicated `build` job.

    # Blocking: `npm run build` is tsup/esbuild, which strips types without
    # checking them, so nothing else in this workflow would catch a type error.
    - name: Typecheck
      run: npm run typecheck

    - name: Run linting
      run: npm run lint

    # ── Test lanes ────────────────────────────────────────────────────
    # Unit and integration are separate jest projects and run as separate,
    # individually attributable steps. BOTH must run: dropping the
    # integration lane from CI would hollow out the suite exactly the way an
    # unenforced coverage gate hollows out the coverage check.
    #
    # Blocking: a failing test suite must fail the build.
    - name: Run unit tests
      run: npm run test:unit

    # Blocking. Real sockets, real child processes, real filesystem writes.
    - name: Run integration tests
      run: npm run test:integration

    # ── Coverage artifact (consumed by the test-guard job) ────────────
    # Generated once, on the 24.x leg only, to avoid a duplicate upload.
    #
    # Runs the FULL suite (both jest projects) — a single-lane run would
    # produce a partial report and understate coverage in test-guard.
    #
    # NO `continue-on-error` here. It used to be set, which meant
    # a coverage run that crashed left the job green while test-guard was fed a
    # missing or stale artifact: the gate measured nothing and nobody noticed.
    # Same precedent as the lint step, whose `continue-on-error` was removed.
    - name: Generate coverage report
      id: coverage
      if: matrix.node-version == '24.x'
      run: npx jest --coverage --coverageReporters=clover --coverageReporters=text-summary

    # `always()`: upload whatever coverage exists even when a step above
    # failed, so a genuine coverage regression can still be inspected in the
    # artifact instead of vanishing. `if-no-files-found: warn` keeps this step
    # from failing on its own — the explicit assertion below owns that verdict
    # and produces a far clearer message.
    - name: Upload coverage artifact
      if: always() && matrix.node-version == '24.x'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage/clover.xml
        retention-days: 7
        if-no-files-found: warn

    # Explicit gate. Deleting `continue-on-error` alone is not
    # enough: the naive version fails downstream on a *missing artifact*, which
    # in the logs is indistinguishable from a real coverage regression. This
    # step makes the two outcomes say different things, out loud.
    - name: Assert coverage artifact is usable
      if: always() && matrix.node-version == '24.x'
      shell: bash
      run: |
        set -uo pipefail
        FILE=coverage/clover.xml

        fail() {
          echo "::error title=$1::$2"
          echo ""
          echo "=============================================================="
          echo "  $1"
          echo "=============================================================="
          echo "$2"
          echo ""
          echo "This is NOT a 'coverage below threshold' failure."
          echo "Nothing was measured at all. The 'Test adequacy gate' job"
          echo "consumes coverage/clover.xml as the 'coverage-report'"
          echo "artifact; without a readable file it cannot evaluate any"
          echo "changed file, and a green run would mean the gate checked"
          echo "nothing."
          echo "=============================================================="
          exit 1
        }

        if [ "${{ steps.coverage.outcome }}" != "success" ]; then
          fail "Coverage generation failed" \
            "The 'Generate coverage report' step exited with outcome '${{ steps.coverage.outcome }}'. Read that step's log for the real cause (jest crash, failing test, OOM). The coverage artifact is unusable as a side effect."
        fi

        if [ ! -f "$FILE" ]; then
          fail "Coverage artifact missing" \
            "Expected $FILE after a successful coverage run, but no such file exists. The coverage reporter did not write it (wrong --coverageReporters, wrong coverageDirectory, or the run was skipped)."
        fi

        if [ ! -s "$FILE" ]; then
          fail "Coverage artifact empty" \
            "$FILE exists but is 0 bytes. The reporter created the file and then wrote nothing to it."
        fi

        if ! grep -q '<coverage' "$FILE"; then
          fail "Coverage artifact unreadable" \
            "$FILE is non-empty ($(wc -c < "$FILE" | tr -d ' ') bytes) but contains no <coverage> element, so it is not a clover report that test-guard can parse."
        fi

        FILES_MEASURED=$(grep -c '<file ' "$FILE" || true)
        if [ "${FILES_MEASURED:-0}" -eq 0 ]; then
          fail "Coverage artifact measures nothing" \
            "$FILE parses as clover but contains zero <file> entries — every source file was excluded, so the gate would trivially pass on an empty measurement set."
        fi

        echo "Coverage artifact OK: $FILE ($(wc -c < "$FILE" | tr -d ' ') bytes, ${FILES_MEASURED} files measured)."

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js 22.x
      uses: actions/setup-node@v6
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build for production
      run: npm run build

    - name: Test MCP server startup
      run: timeout 5s node dist/index.js || true

  # ────────────────────────────────────────────────────────────────────
  # test-guard (PR only)
  #
  # Downloads the "coverage-report" artifact produced by the test job and
  # runs ostico/test-guard to evaluate test adequacy on changed files.
  # Skippable with the 'test-guard-exception' PR label. Skipped on forks
  # (no access to the GitHub Models token used for the AI review).
  # ────────────────────────────────────────────────────────────────────
  test-guard:
    name: Test adequacy gate
    runs-on: ubuntu-latest
    needs: test
    # Run only for same-repo PRs (head repo == this repo). NOTE: this repo is
    # itself a fork, so head.repo.fork is always true here — a `.fork` check
    # would skip every PR. Compare full_name instead to still exclude PRs
    # opened from external forks (no token access for the AI review).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.event.repository.full_name &&
      !contains(github.event.pull_request.labels.*.name, 'test-guard-exception')
    concurrency:
      group: bruno-mcp-test-guard-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      checks: write
      # No `models: read` — it only ever gated GitHub Models, retired 2026-07-30.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report

      # Consumer-side half of the coverage-artifact gate. The producer already asserts the
      # artifact is usable, but this job is the one that renders a verdict on
      # the PR — so it must never be able to report "gate passed" off a file
      # that never arrived. Fails loudly and says which of the two it is.
      - name: Assert downloaded coverage artifact is usable
        shell: bash
        run: |
          set -uo pipefail
          FILE=clover.xml
          if [ ! -s "$FILE" ] || ! grep -q '<coverage' "$FILE"; then
            echo "::error title=Coverage artifact missing or unreadable::The 'coverage-report' artifact did not yield a parseable $FILE, so test-guard has nothing to measure."
            echo ""
            echo "=============================================================="
            echo "  Coverage artifact missing or unreadable"
            echo "=============================================================="
            echo "This is NOT a 'coverage below threshold' failure — no"
            echo "coverage was measured at all. Check the 'Generate coverage"
            echo "report' and 'Assert coverage artifact is usable' steps in"
            echo "the 24.x leg of the test job; the artifact is produced"
            echo "there."
            echo "=============================================================="
            ls -la
            exit 1
          fi
          echo "Downloaded coverage artifact OK: $FILE ($(wc -c < "$FILE" | tr -d ' ') bytes, $(grep -c '<file ' "$FILE") files measured)."
          echo "Any failure after this point is a real coverage/test-adequacy verdict, not a plumbing problem."

      - name: Test Guard
        uses: ostico/test-guard@v2
        with:
          coverage-file: clover.xml
          coverage-threshold: '95'
          # NOTE: do not exclude 'tests/**' here. The action drops excluded paths
          # *before* it splits the diff into source vs test files, so excluding
          # tests/** hides the PR's own new tests from the gate: the test files
          # land in neither bucket, changed-test relevance evaluates to NO, and
          # any PR whose changed lines aren't measurable by diff-cover then fails
          # with "no relevant tests in PR". Tests stay out of the coverage-target
          # set via test-patterns below, which now scopes every JS/TS src_pattern
          # to `src/` — so a non-suite file under tests/ is structurally "neither
          # source nor test" and needs no exclusion of its own.
          extra-exclude-patterns: '.github/**, dist/**, coverage/**, **/*.d.ts, src/index.ts'
          ai-enabled: 'true'
          # test-guard v2: GitHub Models was retired 2026-07-30 and Layer 3 now
          # calls any OpenAI-compatible endpoint, so it needs a provider key.
          # Without ai-api-key the AI phase is skipped and the gate silently
          # falls back to Layer 1 + Layer 2.
          ai-api-key: ${{ secrets.GEMINI_API_KEY }}
          # Trailing slash is required — without it the compat layer 404s.
          ai-base-url: 'https://generativelanguage.googleapis.com/v1beta/openai/'
          # Unprefixed: the `openai/` form was a GitHub Models publisher prefix.
          ai-model: 'gemini-3.1-flash-lite'
          # Gemini 3.x cannot disable thinking; minimal is the floor and low
          # keeps the code-reasoning quality its benchmark scores are based on.
          ai-reasoning-effort: 'low'
          # Gemini 3.x recommends its default of 1.0 and warns that lowering
          # temperature causes looping and degraded reasoning.
          ai-temperature: '1.0'
          # The 8000 default was sized for GitHub Models' retired 8K input cap.
          # Gemini has a 1M context, and at 8000 a large test diff gets shed —
          # which makes the model warn about code it was never shown.
          ai-max-input-tokens: '32000'
          # `test-patterns` MERGES onto the action's 21-language defaults
          # (config.py: `{**_DEFAULT_TEST_PATTERNS, **parsed}`) — it does NOT
          # replace them, and `_matches_source_pattern` returns True if ANY entry
          # matches. So adding a narrow key cannot narrow anything: the previous
          # value here added a `ts-unit` key while the built-in `ts-test`/`ts-spec`/
          # `ts-dir` kept `src_pattern: **/*.ts`, leaving EVERY .ts file in the repo
          # classified as coverage-owing source. It was doubly inert,
          # because fnmatch has no special meaning for `/`: `src/**/*.ts` compiles to
          # `src/.*.*/.*\.ts`, which requires two slashes and so never even matched
          # `src/index.ts`. The correct single-star form is `src/*.ts`, where the
          # `.*` spans separators and matches src/ at any depth.
          #
          # The fix is therefore to OVERRIDE the built-in keys by name, keeping each
          # one's original test_template and changing only src_pattern. Verified
          # against every tracked file: source 28 -> 27 (losing only
          # tests/global-setup.ts, which was never source), all 27 remaining under
          # src/, and all 66 test files still classified as tests — so changed-test
          # relevance is unaffected.
          #
          # Only the JS/TS families are overridden; the other 17 languages keep
          # their `**/*` defaults, which are inert in a TypeScript-only package. If
          # this repo ever gains source in another language, override those keys
          # here the same way rather than adding a new one.
          test-patterns: |
            {
              "ts-test":  {"src_pattern": "src/*.ts",  "test_template": "**/{name}.test.ts"},
              "ts-spec":  {"src_pattern": "src/*.ts",  "test_template": "**/{name}.spec.ts"},
              "ts-dir":   {"src_pattern": "src/*.ts",  "test_template": "**/__tests__/{name}.ts"},
              "tsx-test": {"src_pattern": "src/*.tsx", "test_template": "**/{name}.test.tsx"},
              "tsx-spec": {"src_pattern": "src/*.tsx", "test_template": "**/{name}.spec.tsx"},
              "tsx-dir":  {"src_pattern": "src/*.tsx", "test_template": "**/__tests__/{name}.tsx"},
              "js-test":  {"src_pattern": "src/*.js",  "test_template": "**/{name}.test.js"},
              "js-spec":  {"src_pattern": "src/*.js",  "test_template": "**/{name}.spec.js"},
              "js-dir":   {"src_pattern": "src/*.js",  "test_template": "**/__tests__/{name}.js"},
              "jsx-test": {"src_pattern": "src/*.jsx", "test_template": "**/{name}.test.jsx"},
              "jsx-spec": {"src_pattern": "src/*.jsx", "test_template": "**/{name}.spec.jsx"},
              "jsx-dir":  {"src_pattern": "src/*.jsx", "test_template": "**/__tests__/{name}.jsx"}
            }
